<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Disease Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 { font-size: 2rem; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.6); margin-bottom: 30px; font-size: 0.9rem; }

        .pod-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(99, 102, 241, 0.5);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 30px;
            color: #a5b4fc;
        }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover { border-color: #6366f1; background: rgba(99,102,241,0.05); }
        .upload-area p { color: rgba(255,255,255,0.5); margin-top: 8px; font-size: 0.85rem; }

        #preview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            margin: 15px 0;
            display: none;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .results {
            margin-top: 25px;
            text-align: left;
            display: none;
        }

        .result-title { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 12px; }

        .result-item {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item.top { border-left: 3px solid #6366f1; }
        .disease-name { font-size: 0.95rem; }
        .confidence {
            font-size: 1.1rem;
            font-weight: bold;
            color: #a5b4fc;
        }

        .served-by {
            margin-top: 15px;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.3);
            text-align: center;
        }

        .loading { display: none; color: rgba(255,255,255,0.6); margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔬 Skin Disease Detector</h1>
    <p class="subtitle">Powered by DINOv2 + Kubernetes Auto-Scaling</p>

    <div class="pod-badge">🟢 Connected to: {{ pod_name }}</div>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div style="font-size: 2.5rem">📷</div>
        <p>Klik untuk upload foto kulit</p>
        <p>JPG, PNG, WEBP supported</p>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <img id="preview" alt="preview">

    <button id="analyzeBtn" disabled onclick="analyze()">🔍 Analisa Penyakit</button>

    <div class="loading" id="loading">⏳ Menganalisa gambar...</div>

    <div class="results" id="results">
        <p class="result-title">TOP 3 KEMUNGKINAN DIAGNOSIS:</p>
        <div id="resultList"></div>
        <p class="served-by" id="servedBy"></p>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyzeBtn');

    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                analyzeBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }
    });

    async function analyze() {
        const file = fileInput.files[0];
        if (!file) return;

        analyzeBtn.disabled = true;
        document.getElementById('loading').style.display = 'block';
        document.getElementById('results').style.display = 'none';

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/predict', { method: 'POST', body: formData });
            const data = await response.json();

            const resultList = document.getElementById('resultList');
            resultList.innerHTML = '';

            data.results.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = `result-item ${i === 0 ? 'top' : ''}`;
                div.innerHTML = `
                    <span class="disease-name">${i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'} ${item.disease}</span>
                    <span class="confidence">${item.confidence}</span>
                `;
                resultList.appendChild(div);
            });

            document.getElementById('servedBy').textContent = `Served by: ${data.pod_name}`;
            document.getElementById('results').style.display = 'block';
        } catch(e) {
            alert('Error: ' + e.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
            analyzeBtn.disabled = false;
        }
    }
</script>
</body>
</html>
